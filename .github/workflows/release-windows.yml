name: Release Windows app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'
      - 'index.html'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'tsconfig*.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies
        run: npm ci

      - name: Generate Windows app icons
        run: npx --yes @tauri-apps/cli@^2 icon public/favicon.svg

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          tagName: app-v__VERSION__
          releaseName: 'Cursor Atelier v__VERSION__'
          releaseBody: |
            Windows desktop build of Cursor Atelier.

            Download the `-setup.exe` file below. This unsigned open-source build may trigger Windows SmartScreen on first launch.
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
